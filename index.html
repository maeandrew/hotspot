<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>План будинку</title>
  <style>
    :root { --accent: #1976d2; --bg: #f5f7fa; --text: #1f2937; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: var(--text); background: var(--bg); }
    header { padding: 12px 16px; background: white; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 5; }
    .container { max-width: 1100px; margin: 16px auto; padding: 0 16px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .message { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; }

    .plan-wrap { position: relative; width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    .plan-inner { position: relative; width: 100%; touch-action: none; overflow: hidden; transform-origin: 0 0; }
    .plan-inner img { width: 100%; height: auto; display: block; }
    .hotspot { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.25); transform: translate(-50%, -50%); cursor: pointer; }
    .legend { padding: 8px 12px; font-size: 13px; color: #475569; }

    /* Plan zoom overlay controls */
    .plan-zoom-controls { position: absolute; right: 10px; bottom: 10px; z-index: 5; display: flex; gap: 6px; }
    .plan-zoom-btn { width: 36px; height: 36px; border-radius: 6px; background: rgba(17,24,39,0.8); color: #fff; border: 1px solid #374151; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }

    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; padding: 10px; z-index: 20; }
    .modal.open { display: flex; }
    .modal-content { background: #0b0f15; color: white; width: calc(100vw - 10px); max-width: none; height: calc(100vh - 50px); border-radius: 10px; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #111827; }
    .modal-body { background: #0b0f15; position: relative; overflow: hidden; calc(80vh - 80px); min-height: 0; }
    .modal-body img { position: absolute; top: 0; left: 0; width: auto; height: auto; max-width: none; max-height: none; display: block; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; }
    .modal-footer { display: flex; justify-content: space-between; padding: 8px 12px; background: #111827; }
    .modal button { background: #1f2937; color: #fff; border: 1px solid #374151; }

    .zoom-controls { display: flex; gap: 8px; align-items: center; }
    .icon-btn { width: 36px; height: 32px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
    .hint { font-size: 12px; color: #94a3b8; margin-left: 8px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<header>
  <div class="container toolbar">
    <strong>Будинок</strong>
    <span style="flex:1"></span>
    <label for="planSelect">План:</label>
    <select id="planSelect"></select>
  </div>
</header>
<div class="container">
  <div id="status" class="message hidden"></div>
  <div class="plan-wrap hidden" id="planWrap">
    <div class="plan-inner" id="planInner">
      <img id="planImg" alt="План" />
      <div id="hotspots"></div>
      <div class="plan-zoom-controls">
        <button id="planZoomOut" class="plan-zoom-btn" title="Зменшити">−</button>
        <button id="planZoomIn" class="plan-zoom-btn" title="Збільшити">+</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<!-- Modal Gallery -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div id="modalTitle">Фото</div>
      <div class="zoom-controls">
        <button id="zoomOutBtn" class="icon-btn" title="Зменшити">−</button>
        <button id="zoomInBtn" class="icon-btn" title="Збільшити">+</button>
        <span class="hint" id="zoomHint">Подвійний клік або щипок для зуму</span>
        <button id="closeBtn">Закрити</button>
      </div>
    </div>
    <div class="modal-body">
      <img id="modalImg" src="" alt="" />
    </div>
    <div class="modal-footer">
      <button id="prevBtn">Попереднє</button>
      <div id="counter"></div>
      <button id="nextBtn">Наступне</button>
    </div>
  </div>
</div>

<script>
(function(){
  const planSelect = document.getElementById('planSelect');
  const statusEl = document.getElementById('status');
  const planWrap = document.getElementById('planWrap');
  const planInner = document.getElementById('planInner');
  const planImg = document.getElementById('planImg');
  const hotspotsEl = document.getElementById('hotspots');
  const legendEl = document.getElementById('legend');
  const planZoomInBtn = document.getElementById('planZoomIn');
  const planZoomOutBtn = document.getElementById('planZoomOut');

  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modalImg');
  const modalTitle = document.getElementById('modalTitle');
  const counter = document.getElementById('counter');
  const btnClose = document.getElementById('closeBtn');
  const btnPrev = document.getElementById('prevBtn');
  const btnNext = document.getElementById('nextBtn');
  const btnZoomIn = document.getElementById('zoomInBtn');
  const btnZoomOut = document.getElementById('zoomOutBtn');
  const modalBody = document.querySelector('.modal-body');

  let allPoints = [];
  let natural = {w: 0, h: 0};
  let gallery = { files: [], idx: 0, room: '', plan: '' };

  function showMessage(text){
    statusEl.textContent = text;
    statusEl.classList.remove('hidden');
    planWrap.classList.add('hidden');
  }
  function hideMessage(){
    statusEl.classList.add('hidden');
  }

  async function loadDataJson(){
    const res = await fetch('data.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    return await res.json();
  }

  let DATA = { points: [] };

  async function loadPlans(){
    try{
      DATA = await loadDataJson();
      const points = Array.isArray(DATA) ? DATA : (Array.isArray(DATA.points) ? DATA.points : []);
      allPoints = points;
      const plansSet = new Set(points.map(p=>p.plan).filter(Boolean));
      const plans = Array.from(plansSet);
      planSelect.innerHTML = '';
      if(!plans || plans.length === 0){
        planSelect.classList.add('hidden');
        showMessage('Плани ще не додані');
        return;
      }
      hideMessage();
      planSelect.classList.remove('hidden');
      for(const p of plans){
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = p; planSelect.appendChild(opt);
      }
      const urlPlan = new URL(location.href).searchParams.get('plan');
      if(urlPlan && plans.includes(urlPlan)) planSelect.value = urlPlan;
      await onPlanChange();
    }catch(e){
      console.error(e);
      showMessage('Помилка завантаження даних');
    }
  }

  async function loadPoints(){
    // Points are already loaded from data.json in loadPlans
    try{
      const points = Array.isArray(DATA) ? DATA : (Array.isArray(DATA.points) ? DATA.points : []);
      allPoints = points;
    }catch(e){ allPoints = []; }
  }

  function clearHotspots(){ hotspotsEl.innerHTML = ''; }

  function renderHotspots(plan){
    clearHotspots();
    const pts = allPoints.filter(p => p.plan === plan);
    if(pts.length === 0){ legendEl.textContent = 'Для цього плану точки відсутні.'; return; }
    legendEl.textContent = `Точок: ${pts.length}`;

    for(const p of pts){
      const dot = document.createElement('div');
      dot.className = 'hotspot';
      const leftPct = (parseFloat(p.x) / natural.w) * 100;
      const topPct = (parseFloat(p.y) / natural.h) * 100;
      dot.style.left = leftPct + '%';
      dot.style.top = topPct + '%';
      dot.title = `${p.room}`;
      dot.addEventListener('click', () => openGallery(p));
      hotspotsEl.appendChild(dot);
    }
  }

  // Plan zoom/pan state and logic
  const P = { scale: 1, min: 1, max: 4, x: 0, y: 0, baseW: 0, baseH: 0, vw: 0, vh: 0,
              dragging: false, startX: 0, startY: 0, startTX: 0, startTY: 0,
              pinchDist: 0, pinchStartScale: 1, pinchCenter: {x:0,y:0} };

  function initPlanZoom(){
    // viewport is the visible area of planInner
    const rect = planInner.getBoundingClientRect();
    P.vw = rect.width; P.vh = rect.height;
    // base is current fitted image size
    const iw = planImg.clientWidth; const ih = planImg.clientHeight;
    // Set explicit base size to avoid layout jumps when transforming
    P.baseW = Math.max(1, Math.round(iw));
    P.baseH = Math.max(1, Math.round(ih));
    planInner.style.width = P.baseW + 'px';
    planInner.style.height = P.baseH + 'px';
    P.scale = 1; centerPlan(); applyPlanTransform();
  }
  function centerPlan(){
    // center inside its own viewport (same as base size at scale 1)
    P.x = 0; P.y = 0; // since base equals viewport, no offset is needed
  }
  function applyPlanTransform(){
    const sw = P.baseW * P.scale;
    const sh = P.baseH * P.scale;
    // Allowed translate range so content stays within viewport
    let minX, maxX, minY, maxY;
    if (sw <= P.vw) { minX = maxX = (P.vw - sw) / 2; } else { minX = P.vw - sw; maxX = 0; }
    if (sh <= P.vh) { minY = maxY = (P.vh - sh) / 2; } else { minY = P.vh - sh; maxY = 0; }
    P.x = Math.max(minX, Math.min(P.x, maxX));
    P.y = Math.max(minY, Math.min(P.y, maxY));
    planInner.style.transform = `translate(${P.x}px, ${P.y}px) scale(${P.scale})`;
    const canPanX = sw > P.vw, canPanY = sh > P.vh;
    planInner.style.cursor = (P.scale > 1 && (canPanX || canPanY)) ? (P.dragging ? 'grabbing' : 'grab') : 'default';
  }
  function setPlanScaleAt(cx, cy, newScale){
    const s = Math.max(P.min, Math.min(P.max, newScale));
    const prev = P.scale;
    if(s === prev){ applyPlanTransform(); return; }
    const imgX = (cx - P.x) / prev;
    const imgY = (cy - P.y) / prev;
    P.scale = s;
    P.x = cx - imgX * P.scale;
    P.y = cy - imgY * P.scale;
    applyPlanTransform();
  }

  async function onPlanChange(){
    const plan = planSelect.value;
    if(!plan){ showMessage('Оберіть план'); return; }
    hideMessage();

    try{
      // Try standard background names in uploads/{plan}/
      const candidates = [
        `uploads/${plan}/plan.jpg`,
        `uploads/${plan}/plan.png`,
        `uploads/${plan}/plan.webp`
      ];
      let chosen = '';
      for(const src of candidates){
        const ok = await new Promise(resolve=>{
          const img = new Image();
          img.onload = ()=>resolve(true);
          img.onerror = ()=>resolve(false);
          img.src = src + `?t=${Date.now()}`; // bust cache
        });
        if(ok){ chosen = src; break; }
      }
      if(!chosen){
        // fallback to first photo from points of this plan
        const firstPoint = allPoints.find(p=>p.plan===plan && p.photo);
        if(firstPoint) chosen = firstPoint.photo;
      }
      if(!chosen){
        showMessage('Для плану не знайдено фонового зображення');
        return;
      }
      planImg.src = chosen;
      await new Promise(res => { planImg.onload = res; planImg.onerror = res; });
      natural.w = planImg.naturalWidth || planImg.clientWidth;
      natural.h = planImg.naturalHeight || planImg.clientHeight;
      planWrap.classList.remove('hidden');

      await loadPoints();
      renderHotspots(plan);
      // initialize plan zoom after rendering
      initPlanZoom();
    }catch(e){
      console.error(e);
      showMessage('Не вдалося завантажити дані плану');
    }
  }

  async function openGallery(point){
    try{
      // Build gallery from points belonging to same plan+room
      const filesSet = new Set(
        allPoints.filter(p=>p.plan===point.plan && p.room===point.room && p.photo)
                 .map(p=>p.photo)
      );
      const files = Array.from(filesSet);
      const startIdx = Math.max(0, files.indexOf(point.photo));
      gallery = { files: files.length?files:[point.photo].filter(Boolean), plan: point.plan, room: point.room, idx: startIdx };
      updateModal();
      modal.classList.add('open');
    }catch(e){ console.error(e); }
  }

  function updateModal(){
    if(!gallery.files || gallery.files.length === 0){ modalImg.src=''; counter.textContent=''; return; }
    if(gallery.idx < 0) gallery.idx = 0;
    if(gallery.idx >= gallery.files.length) gallery.idx = gallery.files.length-1;
    const src = gallery.files[gallery.idx];
    modalImg.src = src;
    modalTitle.textContent = `${gallery.plan} / ${gallery.room}`;
    counter.textContent = `${gallery.idx+1} / ${gallery.files.length}`;
    // reset zoom after image source change (wait for load)
    modalImg.onload = () => initZoom();
  }

  btnClose.addEventListener('click', ()=> modal.classList.remove('open'));
  btnPrev.addEventListener('click', ()=>{ gallery.idx--; updateModal(); });
  btnNext.addEventListener('click', ()=>{ gallery.idx++; updateModal(); });
  modal.addEventListener('click', (e)=>{ if(e.target === modal) modal.classList.remove('open'); });

  // Zoom & Pan logic for modal image
  const Z = { scale: 1, min: 1, max: 5, x: 0, y: 0, baseW: 0, baseH: 0, vw: 0, vh: 0,
              dragging: false, startX: 0, startY: 0, startTX: 0, startTY: 0,
              pinchDist: 0, pinchStartScale: 1, pinchCenter: {x:0,y:0} };

  function initZoom(){
    const rect = modalBody.getBoundingClientRect();
    Z.vw = rect.width; Z.vh = rect.height;
    const nw = modalImg.naturalWidth || modalImg.width; // natural size
    const nh = modalImg.naturalHeight || modalImg.height;
    const ratio = Math.min(Z.vw / nw, Z.vh / nh);
    Z.baseW = Math.max(1, Math.round(nw * ratio));
    Z.baseH = Math.max(1, Math.round(nh * ratio));
    modalImg.style.width = Z.baseW + 'px';
    modalImg.style.height = Z.baseH + 'px';
    Z.scale = 1; centerImage(); applyTransform();
  }
  function centerImage(){
    Z.x = (Z.vw - Z.baseW) / 2;
    Z.y = (Z.vh - Z.baseH) / 2;
  }
  function applyTransform(){
    const sw = Z.baseW * Z.scale;
    const sh = Z.baseH * Z.scale;
    // Determine allowed ranges per axis: center if image smaller than viewport
    let minX, maxX, minY, maxY;
    if (sw <= Z.vw) { minX = maxX = (Z.vw - sw) / 2; } else { minX = Z.vw - sw; maxX = 0; }
    if (sh <= Z.vh) { minY = maxY = (Z.vh - sh) / 2; } else { minY = Z.vh - sh; maxY = 0; }
    // clamp so image stays within viewport (or centered if smaller)
    Z.x = Math.max(minX, Math.min(Z.x, maxX));
    Z.y = Math.max(minY, Math.min(Z.y, maxY));
    modalImg.style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.scale})`;
    const canPanX = sw > Z.vw, canPanY = sh > Z.vh;
    modalImg.style.cursor = (Z.scale > 1 && (canPanX || canPanY)) ? (Z.dragging ? 'grabbing' : 'grab') : 'default';
  }
  function setScaleAt(cx, cy, newScale){
    const s = Math.max(Z.min, Math.min(Z.max, newScale));
    const prev = Z.scale;
    if(s === prev){ applyTransform(); return; }
    // point under cursor before scaling in image coords
    const imgX = (cx - Z.x) / prev;
    const imgY = (cy - Z.y) / prev;
    Z.scale = s;
    // keep the same point under the cursor after scaling
    Z.x = cx - imgX * Z.scale;
    Z.y = cy - imgY * Z.scale;
    applyTransform();
  }

  // Buttons
  btnZoomIn.addEventListener('click', ()=>{
    const cx = Z.vw/2, cy = Z.vh/2;
    setScaleAt(cx, cy, Z.scale + 0.25);
  });
  btnZoomOut.addEventListener('click', ()=>{
    const cx = Z.vw/2, cy = Z.vh/2;
    if(Z.scale - 0.25 <= 1){ Z.scale = 1; centerImage(); }
    else setScaleAt(cx, cy, Z.scale - 0.25);
    applyTransform();
  });

  // Double click to toggle zoom
  modalBody.addEventListener('dblclick', (e)=>{
    const rect = modalBody.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    if(Z.scale < 2) setScaleAt(cx, cy, Math.min(2, Z.max));
    else { Z.scale = 1; centerImage(); applyTransform(); }
  });

  // Mouse drag pan
  modalBody.addEventListener('mousedown', (e)=>{
    if(e.button !== 0) return;
    if(Z.scale <= 1) return;
    Z.dragging = true;
    Z.startX = e.clientX; Z.startY = e.clientY;
    Z.startTX = Z.x; Z.startTY = Z.y;
    applyTransform();
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e)=>{
    if(!Z.dragging) return;
    const dx = e.clientX - Z.startX;
    const dy = e.clientY - Z.startY;
    Z.x = Z.startTX + dx;
    Z.y = Z.startTY + dy;
    applyTransform();
  });
  window.addEventListener('mouseup', ()=>{ if(Z.dragging){ Z.dragging=false; applyTransform(); } });

  // Wheel zoom (desktop convenience)
  modalBody.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const rect = modalBody.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const delta = e.deltaY > 0 ? -0.2 : 0.2;
    const target = Z.scale + delta;
    if(target <= 1){ Z.scale = 1; centerImage(); applyTransform(); }
    else setScaleAt(cx, cy, target);
  }, { passive: false });

  // Touch gestures: pan and pinch zoom
  modalBody.addEventListener('touchstart', (e)=>{
    if(e.touches.length === 2){
      e.preventDefault();
      const [t1, t2] = [e.touches[0], e.touches[1]];
      Z.pinchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const rect = modalBody.getBoundingClientRect();
      Z.pinchCenter = { x: ((t1.clientX + t2.clientX)/2) - rect.left,
                        y: ((t1.clientY + t2.clientY)/2) - rect.top };
      Z.pinchStartScale = Z.scale;
    } else if(e.touches.length === 1){
      if(Z.scale <= 1) return; // no pan if not zoomed
      const t = e.touches[0];
      Z.dragging = true;
      Z.startX = t.clientX; Z.startY = t.clientY;
      Z.startTX = Z.x; Z.startTY = Z.y;
    }
  }, { passive: false });

  modalBody.addEventListener('touchmove', (e)=>{
    if(e.touches.length === 2){
      e.preventDefault();
      const [t1, t2] = [e.touches[0], e.touches[1]];
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const scale = Z.pinchStartScale * (dist / (Z.pinchDist || 1));
      setScaleAt(Z.pinchCenter.x, Z.pinchCenter.y, scale);
    } else if(e.touches.length === 1 && Z.dragging){
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - Z.startX;
      const dy = t.clientY - Z.startY;
      Z.x = Z.startTX + dx;
      Z.y = Z.startTY + dy;
      applyTransform();
    }
  }, { passive: false });

  modalBody.addEventListener('touchend', ()=>{ Z.dragging = false; });
  modalBody.addEventListener('touchcancel', ()=>{ Z.dragging = false; });

  // Recenter on window resize while modal open
  window.addEventListener('resize', ()=>{ if(modal.classList.contains('open')) initZoom(); });

  // Plan controls
  planZoomInBtn.addEventListener('click', ()=>{
    const rect = planInner.getBoundingClientRect();
    setPlanScaleAt(rect.width/2, rect.height/2, P.scale + 0.25);
  });
  planZoomOutBtn.addEventListener('click', ()=>{
    const rect = planInner.getBoundingClientRect();
    const target = P.scale - 0.25;
    if(target <= 1){ P.scale = 1; centerPlan(); applyPlanTransform(); }
    else setPlanScaleAt(rect.width/2, rect.height/2, target);
  });

  // Mouse pan
  planInner.addEventListener('mousedown', (e)=>{
    // ignore if clicking on a hotspot when not zoomed? Allow click; only start drag if zoomed
    if(e.button !== 0) return;
    if(P.scale <= 1) return;
    P.dragging = true;
    P.startX = e.clientX; P.startY = e.clientY;
    P.startTX = P.x; P.startTY = P.y;
    applyPlanTransform();
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e)=>{
    if(!P.dragging) return;
    const dx = e.clientX - P.startX;
    const dy = e.clientY - P.startY;
    P.x = P.startTX + dx;
    P.y = P.startTY + dy;
    applyPlanTransform();
  });
  window.addEventListener('mouseup', ()=>{ if(P.dragging){ P.dragging=false; applyPlanTransform(); } });

  // Wheel zoom
  planInner.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const rect = planInner.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const delta = e.deltaY > 0 ? -0.2 : 0.2;
    const target = P.scale + delta;
    if(target <= 1){ P.scale = 1; centerPlan(); applyPlanTransform(); }
    else setPlanScaleAt(cx, cy, target);
  }, { passive: false });

  // Touch gestures for plan: pinch and pan
  planInner.addEventListener('touchstart', (e)=>{
    if(e.touches.length === 2){
      e.preventDefault();
      const [t1, t2] = [e.touches[0], e.touches[1]];
      P.pinchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const rect = planInner.getBoundingClientRect();
      P.pinchCenter = { x: ((t1.clientX + t2.clientX)/2) - rect.left,
                        y: ((t1.clientY + t2.clientY)/2) - rect.top };
      P.pinchStartScale = P.scale;
    } else if(e.touches.length === 1){
      if(P.scale <= 1) return;
      const t = e.touches[0];
      P.dragging = true;
      P.startX = t.clientX; P.startY = t.clientY;
      P.startTX = P.x; P.startTY = P.y;
    }
  }, { passive: false });
  planInner.addEventListener('touchmove', (e)=>{
    if(e.touches.length === 2){
      e.preventDefault();
      const [t1, t2] = [e.touches[0], e.touches[1]];
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const scale = P.pinchStartScale * (dist / (P.pinchDist || 1));
      setPlanScaleAt(P.pinchCenter.x, P.pinchCenter.y, scale);
    } else if(e.touches.length === 1 && P.dragging){
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - P.startX;
      const dy = t.clientY - P.startY;
      P.x = P.startTX + dx;
      P.y = P.startTY + dy;
      applyPlanTransform();
    }
  }, { passive: false });
  planInner.addEventListener('touchend', ()=>{ P.dragging=false; });
  planInner.addEventListener('touchcancel', ()=>{ P.dragging=false; });

  // Recalculate on resize
  window.addEventListener('resize', ()=>{
    // re-fit only when not zoomed; otherwise keep scale and clamp
    const wasScaled = P.scale > 1;
    const prevScale = P.scale;
    const prevCx = P.vw/2, prevCy = P.vh/2;
    const rect = planInner.getBoundingClientRect();
    P.vw = rect.width; P.vh = rect.height;
    // reset base from current image size in layout
    planInner.style.width = '';
    planInner.style.height = '';
    initPlanZoom();
    if(wasScaled){
      // restore scale around center
      setPlanScaleAt(prevCx, prevCy, prevScale);
    }
  });

  planSelect.addEventListener('change', onPlanChange);
  loadPlans();
})();
</script>
</body>
</html>
